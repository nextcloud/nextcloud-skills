name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install pyyaml reuse
      - name: Validate skills and links
        run: python3 scripts/validate_skills.py
      - name: REUSE compliance
        run: reuse lint

  example-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the reference ExApp image
        run: docker build -t example.local/minimal_exapp:ci skills/exapp-development/assets/minimal_exapp

  php-app-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/nextcloud-php-app/assets/minimal_php_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Install xmllint for the manifest check
        run: sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils
      - name: rename.sh produces a clean copy
        run: |
          cp -r . /tmp/renamed && cd /tmp/renamed
          sh rename.sh renamed_app RenamedApp "Renamed App"
          test -f lib/Migration/Version1000Date*.php && test -f js/renamed_app-main.js
      - name: Manifest validates against the app store schema
        run: make check-manifest
      - name: Frontend builds
        run: npm ci && npm run build && test -f js/minimal_php_app-main.mjs && test -f css/minimal_php_app-main.css
      - name: PHP unit suite, Psalm and code style (standalone, no server)
        run: |
          composer install --no-interaction
          vendor/bin/phpunit -c tests/phpunit.xml --testsuite unit
          vendor/bin/psalm --no-cache
          vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Release tarball contains only runtime files
        run: |
          make appstore
          ! tar -tzf build/artifacts/minimal_php_app-*.tar.gz | grep -vE '^minimal_php_app/(appinfo|lib|templates|img|js|css)/|^minimal_php_app/$'
